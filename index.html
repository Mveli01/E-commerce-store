<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <script src="index.js" type="module"></script>
    <link rel="stylesheet" href="index.css">
    <title>E-commerce</title>
</head>
<body>
    <header id="page-header">
    <h1><a href="index.html">E-commerce Store</a></h1>
    <div id="search-container">
    <input id="search-input" placeholder="Search products...">
    <button id="search-btn">Search</button>
    </div>
    <ul>
        <a class="company-info" href="aboutus.html">About us</a>
        <li><label for="product">Products:</label>
        <select name="product">
            <option value="all">All</option>
            <option value="Electronics & Gadgets">Electronics & Gadgets</option>
            <option value="Fashion & Apparel">Fashion & Apparel</option>
            <option value="Beauty & Personal Care">Beauty & Personal Care</option>
            <option value="Home & Kitchen">Home & Kitchen</option>
            <option value="Health & Fitness">Health & Fitness</option>
        </select>
        </li>
        <a class="company-info" href="contact.html">Contact</a>

         <div id="cart-wrapper">
            <span class="fas fa-shopping-cart fa-lg"></span> 
            <span id="cart-count">0</span>
   
     </div>
           
     </header>
      <div id="cart-products-container">
        <div id="cart-products"></div>
     </div>
     

    <main id="product-container"></main>
    
    <div id="modal-wrapper">
    <div id="modal-container"></div>
    </div>

     <div id="payment-modal-wrapper">
        <div id="payment-modal-container"></div>
    </div>
